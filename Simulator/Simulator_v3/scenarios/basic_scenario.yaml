# Basic Scenario
# Simple test scenario with 5 agents and 20 requests
# Useful for quick testing and demonstration

name: Basic Scenario
description: Simple test scenario with 5 agents and 20 standard CMO requests

# Simulation start time
# Format: ISO 8601 datetime with timezone
# If no timezone specified, defaults to EST (UTC-5)
start_time: "2024-01-15T09:00:00-05:00"

# Routing configuration (all optional, defaults shown)
routing_config:
  pilot_program_enabled: true

# Agents
# Required fields: agent_id, full_name, skillsets
# Optional fields: is_absent
agents:
  - agent_id: AGENT001
    full_name: Alice Johnson
    skillsets: [SkillA]

  - agent_id: AGENT002
    full_name: Bob Smith
    skillsets: [SkillA, SkillB]

  - agent_id: AGENT003
    full_name: Carol Davis
    skillsets: [SkillA]

  - agent_id: AGENT004
    full_name: David Wilson
    skillsets: [SkillA]

  - agent_id: AGENT005
    full_name: Eve Martinez
    skillsets: [SkillA, SkillC]

# Requests
# Required fields: request_id, skill_id
# Date specification (choose one):
#   - order_date_offset_hours: hours relative to start_time (negative = past)
#   - order_date: absolute ISO 8601 datetime
#   - neither: defaults to start_time
# Optional fields: Many (see below)
requests:
  # Recent requests (< 1 day old)
  - request_id: REQ001
    skill_id: SkillA
    order_date_offset_hours: -2  # 2 hours ago
    foc_target: 7.0
    product: ProductA
    service_region: Ontario
    workorder_status: new

  - request_id: REQ002
    skill_id: SkillA
    order_date_offset_hours: -4
    foc_target: 7.0
    workorder_status: new


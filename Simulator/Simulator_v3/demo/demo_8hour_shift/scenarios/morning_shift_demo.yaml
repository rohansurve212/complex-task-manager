name: Morning Shift Demo - 8 Hours
description: |
  Realistic 8-hour morning shift simulation (9 AM - 5 PM EST)
  
  Team Setup:
  - 6 agents total
  - 5 agents working (alice, bob, carol, dave, eve)
  - 1 agent absent (frank - on vacation)
  
  Request Mix:
  - 25 new requests (backlog from overnight)
  - 8 followup requests (5 for present agents, 3 for frank)
  - Mix of priorities (winback, escalated, SLA, commons)
  - Various FOC targets (3, 5, 7, 10 days)
  - Realistic handle times (10-25 minutes per request)
  
  Expected Outcomes:
  - Frank's followups redistributed to other agents
  - Priority requests processed first
  - All agents stay busy throughout shift
  - ~28-32 requests completed in 8 hours
  - Work distributed across the full 8-hour period

start_time: "2024-05-01T09:00:00-04:00"  # 9 AM EST

routing_config:
  pilot_program_enabled: true
  followup_window_1_start: 14.0   # 10:00 AM EST (14:00 UTC)
  followup_window_1_end: 15.5     # 11:30 AM EST (15:30 UTC)
  followup_window_2_start: 19.5   # 3:30 PM EST (19:30 UTC)
  followup_window_2_end: 20.0     # 4:00 PM EST (20:00 UTC)

# HANDLE TIME CONFIGURATION
simulation_config:
  # Base handle times by priority level (in minutes)
  # Higher priority = more complex = longer handle time
  priority_handle_times:
    1: 176  # Winback/ATL + Escalated (complex customer issues)
    2: 144  # Winback/ATL (retention effort required)
    3: 160  # SLA + Escalated (contract customers with issues)
    4: 128  # Escalated (troubleshooting required)
    5: 112  # Commons (standard new orders)
  
  # Handle time variation (std deviation in minutes)
  handle_time_std_dev: 4  # ±4 minutes variation
  
  # Followup handle times (usually quicker - just updates)
  followup_handle_time: 12  # Followups are typically faster
  
  # Default if priority not specified
  default_handle_time: 15

# ============================================================================
# AGENTS
# ============================================================================

